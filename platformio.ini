; PlatformIO project configuration for the CrowPanel 7" HMI LedFX controller.
;
; Build with:
;   pio run -e crowpanel-7inch
; Flash over USB with:
;   pio run -e crowpanel-7inch -t upload --upload-port /dev/ttyUSB0
; Flash over WiFi (no cable — see [env:crowpanel-7inch-ota] below):
;   pio run -e crowpanel-7inch-ota -t upload

[platformio]
default_envs = crowpanel-7inch

[env:crowpanel-7inch]
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The CrowPanel 7" HMI uses an ESP32-S3-WROOM-1-N4R8 (4 MB flash, 8 MB PSRAM).
; arduino-esp32 does not yet have a board definition for this module, so we
; override the defaults directly. The actual PCB exposes the module's native
; USB-CDC so DTR/RTS can be used for auto-reset.
board_build.esp.psram = enabled
board_build.arduino.memory_type = qio_opi
; OTA-capable dual-app layout (Tier 4). Was huge_app.csv (single 3 MB app);
; network updates need two app slots. See partitions_ota.csv.
board_build.partitions = partitions_ota.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.require_upload_port = true

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_CUSTOM_CONF=0
    -DLV_COLOR_DEPTH=16

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^8.3.0
    bblanchon/ArduinoJson @ ^6.21.0

; ---------------------------------------------------------------------------
; Network-OTA upload environment (Tier 4). Reflash the wall-mounted panel over
; WiFi instead of unmounting it for a USB cable. The device advertises itself
; as `ledfx-hmi-<hex>.local` and shows its hostname + OTA password on the
; Global tab (also printed to Serial on boot).
;
;   pio run -e crowpanel-7inch-ota -t upload \
;       --upload-port ledfx-hmi-<hex>.local \
;       --upload-flags "--auth=<ota-password>"
;
; or set upload_port / the --auth flag here once you know your device's values.
; The built image is identical to the USB env — only the upload transport
; differs — so `pio run -e crowpanel-7inch` remains the canonical build.
; ---------------------------------------------------------------------------
[env:crowpanel-7inch-ota]
extends = env:crowpanel-7inch
upload_protocol = espota
; upload_port = ledfx-hmi-abc123.local
; upload_flags = --auth=abc123hmi2026
